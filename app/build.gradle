plugins {
    id 'com.android.application'
}

// Load environment properties from .env file if available
ext.envProps = new Properties()
def envFile = rootProject.file('.env')
if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        ext.envProps.load(reader)
    }
}

ext.getEnvProperty = { String key, String defaultValue = null ->
    return System.getenv(key) ?: (ext.envProps.getProperty(key) ?: (project.findProperty(key) ?: defaultValue))
}

android {
    namespace 'com.mrhars007.mocklocation'
    compileSdk 28
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.mrhars007.mocklocation'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            def keystorePath = getEnvProperty("RELEASE_KEYSTORE_PATH")
            def storePasswordVal = getEnvProperty("RELEASE_KEYSTORE_PASSWORD")
            def keyAliasVal = getEnvProperty("RELEASE_KEY_ALIAS")
            def keyPasswordVal = getEnvProperty("RELEASE_KEY_PASSWORD")

            if (keystorePath) {
                def keystoreFile = file(keystorePath)
                if (!keystoreFile.exists()) {
                    keystoreFile = rootProject.file(keystorePath)
                }
                if (keystoreFile.exists() && storePasswordVal && keyAliasVal && keyPasswordVal) {
                    storeFile keystoreFile
                    storePassword storePasswordVal
                    keyAlias keyAliasVal
                    keyPassword keyPasswordVal
                    v1SigningEnabled true
                    v2SigningEnabled true
                }
            }
        }
        debug {
            // Inherits default debug keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero external dependencies - pure native Android framework APIs
}
